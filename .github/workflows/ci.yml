name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Same major version as Android Studio's bundled JBR, which builds the app locally.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # No local.properties on CI: the app falls back to its built-in URLs, no Sentry, unsigned release.
      - name: Unit tests, lint, release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: sofasports-release-unsigned
          path: app/build/outputs/apk/release/*.apk
